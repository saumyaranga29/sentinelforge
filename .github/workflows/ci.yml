name: SentinelForge CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-verify:
    name: Run Automated Tests & Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite (35 tests)
        run: |
          pytest tests/ -v

      - name: Run In-Repo Retrieval Evaluation Benchmark
        run: |
          python eval/run_eval.py

      - name: Build Docker Container
        run: |
          docker build -t sentinelforge:latest -f Dockerfile .

