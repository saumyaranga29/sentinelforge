[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelforge"
version = "0.1.0"
description = "Privacy-first AI developer platform integrating MCP, local RAG, and sandboxed code-generation agent"
authors = [{ name = "SentinelForge Team" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.3.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastembed>=0.3.0",
    "chromadb>=0.5.0",
    "pypdf>=4.2.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "unidiff>=0.7.5",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

