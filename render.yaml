services:
  - type: web
    name: sentinelforge
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn sentinelforge.api.app:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_MODE
        value: production
      - key: LLM_PROVIDER
        value: mock
      - key: HF_HUB_OFFLINE
        value: "1"
      - key: ANONYMIZED_TELEMETRY
        value: "False"

